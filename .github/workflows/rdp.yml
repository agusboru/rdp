name: Chrome Remote Desktop & MuMu Player Windows

on:
  workflow_dispatch: # Dapat dijalankan secara manual dari tab Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download & Install Chrome Remote Desktop
      run: |
        $updater = "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi"
        Invoke-WebRequest -Uri $updater -OutFile "chromeremotedesktophost.msi"
        Start-Process msiexec.exe -ArgumentList "/i chromeremotedesktophost.msi /quiet /qn /norestart" -Wait

    - name: Download & Install MuMu Player
      run: |
        # Download installer MuMu Player
        $mumuUrl = "https://a11.gdl.netease.com/MuMuPlayerGlobal-v12.0.0.0-installer.exe"
        Invoke-WebRequest -Uri $mumuUrl -OutFile "mumu_setup.exe"
        
        # Jalankan instalasi secara silent/background
        Start-Process -FilePath ".\mumu_setup.exe" -ArgumentList "/S" -Wait

    - name: Konfigurasi dan Jalankan Chrome RDP
      run: |
        $Pin = "${{ secrets.CRD_PIN }}"
        ${{ secrets.CRD_CODE }} --pin=$Pin

    - name: Mencegah Runner Mati (Keep-Alive)
      run: |
        Write-Host "Chrome Remote Desktop dan MuMu Player berhasil disiapkan!"
        # Loop untuk menjaga sesi tetap aktif hingga batas maksimum timeout (6 jam)
        $timeout = 360 # Menit
        $elapsed = 0
        while ($elapsed -lt $timeout) {
            Start-Sleep -Seconds 60
            $elapsed++
            Write-Host "RDP Aktif: $elapsed / $timeout menit..."
        }
