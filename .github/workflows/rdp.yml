name: Chrome Remote Desktop Windows

on:
  workflow_dispatch: # Dapat dijalankan secara manual dari tab Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download & Install Chrome Remote Desktop
      run: |
        $updater = "https://dl.google.com/installed-apps/chromeremotedesktop/chromeremotedesktophost.msi"
        Invoke-WebRequest -Uri $updater -OutFile "chromeremotedesktophost.msi"
        Start-Process msiexec.exe -ArgumentList "/i chromeremotedesktophost.msi /quiet /qn /norestart" -Wait

    - name: Konfigurasi dan Jalankan Chrome RDP
      run: |
        $Pin = "${{ secrets.CRD_PIN }}"
        $AuthCode = "${{ secrets.CRD_CODE }}"
        
        # Menjalankan perintah otorisasi dari Google dengan PIN yang ditentukan
        Invoke-Expression "$AuthCode --pin=$Pin"

    - name: Mencegah Runner Mati (Keep-Alive)
      run: |
        Write-Host "Chrome Remote Desktop berhasil dikonfigurasi dan berjalan!"
        # Loop untuk menjaga sesi tetap aktif hingga batas maksimum timeout (6 jam)
        $timeout = 360 # Menit
        $elapsed = 0
        while ($elapsed -lt $timeout) {
            Start-Sleep -Seconds 60
            $elapsed++
            Write-Host "RDP Aktif: $elapsed / $timeout menit..."
        }
