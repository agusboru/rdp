name: Chrome Remote Desktop, MuMu Player & Python Windows

on:
  workflow_dispatch: # Dapat dijalankan secara manual dari tab Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download & Install Chrome Remote Desktop
      run: |
        $updater = "https://dl.google.com/edgedl/chrome-remote-desktop/chromeremotedesktophost.msi"
        Invoke-WebRequest -Uri $updater -OutFile "chromeremotedesktophost.msi"
        Start-Process msiexec.exe -ArgumentList "/i chromeremotedesktophost.msi /quiet /qn /norestart" -Wait

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Menyiapkan Python versi 3.11 secara otomatis

    - name: Verify Python & Install Basic Packages
      run: |
        python --version
        pip --version
        # Jika Anda butuh library pendukung seperti OpenCV atau ADB wrapper, install di sini:
        # pip install opencv-python numpy

    - name: Download & Install MuMu Player
      run: |
        # Download installer versi terbaru dari endpoint resmi
        $mumuUrl = "https://a11.gdl.netease.com/MuMuPlayerGlobal-installer.exe"
        
        # Opsi cadangan jika link NetEase pertama diblokir/error:
        # $mumuUrl = "https://mumuglobal.com/download/MuMuPlayerGlobal-installer.exe"

        Invoke-WebRequest -Uri $mumuUrl -OutFile "mumu_setup.exe" -UserAgent "Mozilla/5.0"
        Start-Process -FilePath ".\mumu_setup.exe" -ArgumentList "/S" -Wait

    - name: Konfigurasi dan Jalankan Chrome RDP
      run: |
        $Pin = "${{ secrets.CRD_PIN }}"
        ${{ secrets.CRD_CODE }} --pin=$Pin

    - name: Mencegah Runner Mati (Keep-Alive)
      run: |
        Write-Host "CRD, Python, dan MuMu Player siap digunakan!"
        $timeout = 360 # Menit
        $elapsed = 0
        while ($elapsed -lt $timeout) {
            Start-Sleep -Seconds 60
            $elapsed++
            Write-Host "RDP Aktif: $elapsed / $timeout menit..."
        }
